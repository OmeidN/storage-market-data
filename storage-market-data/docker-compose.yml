services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: storage
      POSTGRES_PASSWORD: storage
      POSTGRES_DB: storage_market_data
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storage -d storage_market_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://storage:storage@db:5432/storage_market_data
      REQUEST_DELAY_SECONDS: "3"
      LOG_LEVEL: INFO
      RAW_DATA_DIR: /app/data/raw
    volumes:
      - ./data/raw:/app/data/raw

volumes:
  pgdata:
