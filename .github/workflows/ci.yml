name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storage-market-data
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: storage
          POSTGRES_PASSWORD: storage
          POSTGRES_DB: storage_market_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storage -d storage_market_data_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://storage:storage@localhost:5432/storage_market_data_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: storage-market-data/pyproject.toml
      - name: Install app
        run: pip install -e ".[dev]"
      - name: Migrate test database
        run: alembic upgrade head
      - name: Run tests
        run: pytest tests/ -v
